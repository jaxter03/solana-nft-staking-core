[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
nft_staking_core = "h9Ku7LMnUXYojrRPxc85kTdz8YUdKK33RFAWfrzaaxy"

[programs.devnet]
nft_staking_core = "h9Ku7LMnUXYojrRPxc85kTdz8YUdKK33RFAWfrzaaxy"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

# The local validator clones Metaplex Core from devnet so CPIs hit the real program.
[test.validator]
url = "https://api.devnet.solana.com"
rpc_port = 8999
faucet_port = 9991
gossip_port = 8100
dynamic_port_range = "8200-8300"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"

[hooks]
